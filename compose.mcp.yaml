name: grafana-mcp

services:
  mcp-grafana:
    image: grafana/mcp-grafana:latest
    container_name: mcp-grafana
    restart: unless-stopped
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
      MCP_GRAFANA_SERVER_TOKEN: ${MCP_GRAFANA_SERVER_TOKEN}
    command:
      - -t
      - streamable-http
      - --allowed-hosts
      - 127.0.0.1:8001,localhost:8001,mcp-grafana:8000,mcp-grafana.julidcardenas.site
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - redinterna

networks:
  redinterna:
    external: true
